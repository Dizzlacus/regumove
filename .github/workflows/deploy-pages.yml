# Builds the noindexed preview (GITHUB_PAGES=true, base /regumove) and publishes it to
# https://dizzlacus.github.io/regumove/. Production (regumove.com) deploys via Cloudflare, not here.
name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the version from "packageManager" in package.json (pnpm@10.11.1).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml approves the esbuild, workerd and sharp build scripts.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
